name: Release

# Publishes a signed production release when a version tag (v1.2.3, v1.2.3-beta.1) is pushed.
# The job runs in the protected "production" environment, which holds the signing secrets and
# can require a maintainer's approval before it starts. See Docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PACKAGES: >-
    platform-tools
    platforms;android-35
    build-tools;35.0.0
    ndk;27.0.12077973
    cmake;3.22.1

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign build provenance
      attestations: write  # store build provenance
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.([1-9][0-9]*))?$ ]]; then
            echo "::error::Use vX.Y.Z or vX.Y.Z-alpha.N, -beta.N, or -rc.N"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          suffix="${BASH_REMATCH[4]:-}" stage="${BASH_REMATCH[5]:-}" sequence="${BASH_REMATCH[6]:-}"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be <= 99 to fit the Android versionCode scheme"
            exit 1
          fi
          qualifier=99
          if [[ -n "$suffix" ]]; then
            if (( sequence > 29 )); then
              echo "::error::pre-release sequence must be from 1 to 29"
              exit 1
            fi
            case "$stage" in
              alpha) qualifier=$sequence ;;
              beta)  qualifier=$((30 + sequence)) ;;
              rc)    qualifier=$((60 + sequence)) ;;
            esac
          fi
          name="${tag#v}"
          code=$(( (major * 10000 + minor * 100 + patch) * 100 + qualifier ))
          if (( code < 1 || code > 2100000000 )); then
            echo "::error::derived Android versionCode $code is outside 1..2100000000"
            exit 1
          fi
          prerelease=false
          [[ -n "$suffix" ]] && prerelease=true
          {
            echo "name=$name"
            echo "code=$code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ForgeKit $name (versionCode $code, prerelease=$prerelease)"

      - name: Require release notes in CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.name }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/^\[.*\]: /d' > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$version]' section with content"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - name: Set up Gradle (validates the wrapper)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Give Gradle the runner's memory
        # User-level properties override the project's gradle.properties (tuned for small machines).
        run: mkdir -p ~/.gradle && printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=4\n' >> ~/.gradle/gradle.properties

      - name: Run tests
        run: ./gradlew test

      - name: Verify bundled bootstrap provenance
        run: (cd third-party/termux-bootstrap && sha256sum -c SHA256SUMS)

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set in the production environment"
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and command-line tools
        env:
          FORGEKIT_REQUIRE_SIGNING: 'true'
          FORGEKIT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FORGEKIT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          FORGEKIT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          FORGEKIT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          :tools:forge-builder:distZip :tools:forge-validator:distZip
          -Pforgekit.versionName=${{ steps.version.outputs.name }}
          -Pforgekit.versionCode=${{ steps.version.outputs.code }}

      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner.txt"

      - name: Stage release files
        run: |
          version="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ForgeKit-$version.apk"
          cp "tools/forge-builder/build/distributions/forge-builder-$version.zip" dist/
          cp "tools/forge-validator/build/distributions/forge-validator-$version.zip" dist/
          cp LICENSE "dist/LICENSE-GPL-3.0.txt"
          cp third-party/THIRD_PARTY_NOTICES.md dist/
          (cd third-party && zip -qr "$OLDPWD/dist/third-party-licenses-$version.zip" licenses termux-bootstrap)
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          cert_sha256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -1)
          if [[ -z "$cert_sha256" ]]; then
            echo "::error::Could not read the APK signing-certificate digest"
            exit 1
          fi
          {
            echo
            echo "### Verify"
            echo
            echo 'Check downloads with `sha256sum -c SHA256SUMS` and the build provenance with'
            echo '`gh attestation verify ForgeKit-'"$version"'.apk --repo ${{ github.repository }}`.'
            echo
            echo "APK signing certificate SHA-256: \`$cert_sha256\`"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "${{ steps.version.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ForgeKit ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag "${flags[@]}"

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
