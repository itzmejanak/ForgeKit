# ForgeKit Gradle environment (2 CPU / 4GB sandbox tuned)
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# JDK 21 is discovered automatically (JAVA_HOME / standard install locations).
# A machine-specific path belongs in ~/.gradle/gradle.properties, not here.
org.gradle.java.installations.auto-detect=true
